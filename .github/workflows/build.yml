name: build-derived
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release -p horizon-prepare -- --prepare --server-jar
      - run: bash packaging/android/make_derived_pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-derived
          path: target/android/horizon-derived.zip
